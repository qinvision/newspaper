const directory=document.getElementById('directory'),input=document.getElementById('searchInput'),clearButton=document.getElementById('clearSearch'),empty=document.getElementById('emptyState'),status=document.getElementById('resultStatus'),totalInfo=document.getElementById('totalInfo');
const esc=t=>t.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function render(){
  directory.innerHTML=categories.map((category,index)=>`<section class="category" data-category="${index}"><div class="category-head"><h2 class="category-title">${esc(category.name)}</h2><span class="category-count">${category.items.length} 家</span></div><div class="grid">${category.items.map(([name,url])=>url?`<a class="media-btn" href="${esc(url)}" target="_blank" rel="noopener noreferrer" data-name="${esc(name)}" data-url="${esc(url)}">${esc(name)}</a>`:`<span class="media-btn disabled" data-name="${esc(name)}">${esc(name)}<span class="unavailable-note">暂无电子版入口</span></span>`).join('')}</div></section>`).join('');
}
function filter(){
  const q=input.value.trim().toLowerCase();let total=0;
  document.querySelectorAll('.category').forEach(section=>{let shown=0;section.querySelectorAll('.media-btn').forEach(item=>{const match=!q||item.dataset.name.toLowerCase().includes(q);item.hidden=!match;if(match)shown++});section.querySelector('.category-count').hidden=!!q;section.hidden=shown===0;total+=shown});
  clearButton.hidden=!q;empty.classList.toggle('show',!!q&&!total);status.innerHTML=q?`找到 <strong>${total}</strong> 家相关报纸`:'';
}
render();
const count=categories.reduce((sum,c)=>sum+c.items.length,0);totalInfo.textContent=`共收录 ${count} 家报纸`;
input.addEventListener('input',filter);
clearButton.addEventListener('click',()=>{input.value='';filter();input.focus()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.activeElement===input){input.value='';filter();input.blur()}});
const backTop=document.getElementById('backTop');
addEventListener('scroll',()=>backTop.classList.toggle('show',scrollY>380),{passive:true});
backTop.addEventListener('click',()=>scrollTo({top:0,behavior:'smooth'}));
