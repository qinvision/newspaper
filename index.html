<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>中国报纸名录</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#f5f3ee; --card:#fff; --ink:#1f1d1a; --muted:#7c7568;
    --line:#e6e1d7; --accent:#a6321f; --accent-soft:#f7ebe7;
    --ok:#2f7d4f; --warn:#b8860b;
  }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}
  button{font-family:inherit}

  /* ---------- 头部 ---------- */
  header{
    background:#1f1d1a; color:#f5f3ee;
    padding:34px 24px 30px;
    border-bottom:4px solid var(--accent);
  }
  .hd{max-width:1400px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap}
  header h1{
    font-family:"Songti SC","STSong","SimSun",serif;
    font-size:29px; letter-spacing:2px; font-weight:700;
  }
  header .sub{margin-top:8px;font-size:13.5px;color:#b8b0a2;letter-spacing:.4px}
  header .sub b{color:#f0c9b8;font-weight:600}

  /* ---------- 工具栏（sticky，按钮固定在其右上角） ---------- */
  .toolbar{
    position:sticky; top:0; z-index:30;
    background:rgba(245,243,238,.95);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
    padding:12px 24px;
  }
  .tb{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:16px}
  #q{
    flex:1; min-width:220px; max-width:520px;
    padding:10px 16px; font-size:14px;
    border:1px solid var(--line); border-radius:24px;
    background:#fff; color:var(--ink); outline:none; transition:.2s;
  }
  #q:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
  #hint{font-size:13px;color:var(--muted);white-space:nowrap}

  /* ---------- 模式切换按钮（工具栏内右上角，与 hint 同一水平线） ---------- */
  #modeBtn{
    flex-shrink:0;
    margin-left:auto;
    padding:9px 18px;
    border-radius:24px;
    background:var(--ink);
    border:1px solid var(--ink);
    color:#f5f3ee;
    font-size:13.5px;
    letter-spacing:.5px;
    white-space:nowrap;
    cursor:pointer;
    transition:background .18s,border-color .18s,transform .18s,box-shadow .18s;
  }
  #modeBtn:hover{
    background:#3a352d;
    border-color:#3a352d;
    transform:translateY(-1px);
    box-shadow:0 6px 16px rgba(30,26,20,.2);
  }
  #modeBtn.on{
    background:var(--accent);
    border-color:var(--accent);
  }
  #modeBtn.on:hover{
    background:#8d2919;
    border-color:#8d2919;
    box-shadow:0 6px 16px rgba(120,40,20,.3);
  }

  /* 编辑提示条 */
  #editbar{
    display:none;
    background:#fff8ec;
    border-bottom:1px solid #e8d9b8;
    padding:10px 24px;
  }
  #editbar.show{display:block}
  #editbar .inner{
    max-width:1400px;margin:0 auto;
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    font-size:13px;color:#7a6224;
  }
  #editbar .inner b{color:var(--accent)}
  #editbar .sp{flex:1}
  #editbar button{
    padding:6px 14px;border-radius:18px;font-size:12.5px;cursor:pointer;
    border:1px solid #d9c9a3;background:#fff;color:#7a6224;transition:.16s;
  }
  #editbar button:hover{background:#fdf3dd}
  #editbar button.warn{border-color:#d9b88f;color:#8a5a1a}
  #editbar button.warn:hover{background:#fdf0dd}
  #editbar button.html{border-color:#b8c9a3;color:#4a6a2a}
  #editbar button.html:hover{background:#eef5e2}

  /* ---------- 布局 ---------- */
  .wrap{max-width:1400px;margin:0 auto;padding:0 24px 90px}
  .layout{display:grid;grid-template-columns:190px minmax(0,1fr);gap:32px;align-items:start}

  /* ---------- 侧栏 ---------- */
  aside{
    position:sticky; top:74px;
    max-height:calc(100vh - 100px); overflow-y:auto;
    padding:20px 0; border-right:1px solid var(--line);
    scrollbar-width:thin;
  }
  aside h2{
    font-size:11px;letter-spacing:2px;color:var(--muted);
    text-transform:uppercase;margin-bottom:10px;padding-left:12px;font-weight:600;
  }
  aside a{
    display:flex;justify-content:space-between;align-items:center;gap:6px;
    padding:6px 12px;font-size:13.5px;color:#4a453d;
    border-left:3px solid transparent;border-radius:0 6px 6px 0;transition:.15s;
  }
  aside a:hover{background:#fff;color:var(--accent)}
  aside a .n{font-size:11px;color:#a9a294;font-variant-numeric:tabular-nums}
  aside a.active{border-left-color:var(--accent);background:#fff;color:var(--accent);font-weight:600}
  aside a.active .n{color:var(--accent)}

  /* ---------- 区域 ---------- */
  .region{margin-bottom:44px;scroll-margin-top:80px}
  .region-hd{
    display:flex;align-items:baseline;gap:12px;
    padding-bottom:10px;margin-bottom:16px;
    border-bottom:2px solid var(--ink);
  }
  .region-hd h3{
    font-family:"Songti SC","STSong","SimSun",serif;
    font-size:22px;letter-spacing:1px;
  }
  .region-hd .count{font-size:12px;color:var(--muted)}
  .region-hd .add{
    margin-left:auto;
    padding:4px 14px;border-radius:16px;font-size:12px;cursor:pointer;
    border:1px dashed #c9b995;background:#fff;color:#8a7a4f;transition:.16s;
  }
  .region-hd .add:hover{background:#fdf6e6;border-color:var(--accent);color:var(--accent)}

  /* ---------- 卡片 ---------- */
  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));
    gap:12px;
  }
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:14px 16px 12px;transition:.16s;position:relative;overflow:hidden;
    display:flex;flex-direction:column;
  }
  .card::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
    background:var(--accent);opacity:0;transition:.16s;
  }
  .card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(60,45,25,.09);border-color:#d9d1c2}
  .card:hover::before{opacity:1}
  .card.hide{display:none}
  .card:not(.editing){cursor:pointer}

  .c-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .code{
    font-size:11.5px;font-weight:600;letter-spacing:.3px;
    background:var(--accent-soft);color:var(--accent);
    padding:2px 7px;border-radius:5px;font-variant-numeric:tabular-nums;
  }
  .period{
    font-size:11.5px;color:var(--muted);
    padding:2px 7px;border-radius:5px;background:#f3f0ea;
  }
  .c-name{font-size:15px;font-weight:600;line-height:1.35;margin-bottom:9px;letter-spacing:.2px}
  .c-meta{display:flex;gap:14px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-bottom:8px}
  .c-meta b{color:#3d3830;font-weight:600}
  .c-cat{
    font-size:11.5px;color:#8a8376;
    border-top:1px dashed #ebe6dc;padding-top:7px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }

  /* 卡片底部动作 */
  .c-foot{
    display:flex;justify-content:flex-end;align-items:center;gap:14px;
    margin-top:8px;min-height:22px;
  }
  .c-link{
    font-size:11.5px;opacity:.75;
    display:inline-flex;align-items:center;gap:3px;transition:.15s;
    cursor:pointer;
  }
  .card:hover .c-link{opacity:1}
  .c-link:hover{text-decoration:underline}
  .c-link-web{color:var(--accent)}
  .c-link-ep{color:var(--ok)}
  .c-actions{display:flex;gap:6px}
  .mini{
    padding:3px 11px;border-radius:12px;font-size:11.5px;cursor:pointer;
    border:1px solid #e0d9cc;background:#fff;color:#6b6459;transition:.15s;
  }
  .mini:hover{background:#f6f2ea;border-color:#cdc3b1}
  .mini.del{color:#a6321f;border-color:#e8cfc9}
  .mini.del:hover{background:#fdeceb}

  /* ---------- 弹窗 ---------- */
  .modal{
    display:none;position:fixed;inset:0;z-index:100;
    background:rgba(30,26,20,.5);backdrop-filter:blur(3px);
    align-items:center;justify-content:center;padding:20px;
  }
  .modal.show{display:flex}
  .mbox{
    background:#fff;border-radius:14px;padding:26px 28px;
    width:100%;max-width:380px;
    box-shadow:0 20px 60px rgba(0,0,0,.28);
    animation:pop .18s ease-out;
  }
  .mbox.wide{max-width:480px}
  @keyframes pop{from{transform:translateY(12px) scale(.97);opacity:0}to{transform:none;opacity:1}}
  .mbox h3{font-size:17px;margin-bottom:6px;letter-spacing:.5px}
  .mbox .desc{font-size:12.5px;color:var(--muted);margin-bottom:16px}
  .mbox input,.mbox textarea{
    width:100%;padding:10px 13px;font-size:14px;
    border:1px solid var(--line);border-radius:9px;outline:none;
    background:#fbfaf7;color:var(--ink);transition:.16s;
    font-family:inherit;
  }
  .mbox input:focus,.mbox textarea:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-soft)}
  .mbox .err{font-size:12px;color:#c0392b;margin-top:10px;min-height:16px}
  .mact{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
  .mact button{
    padding:8px 20px;border-radius:20px;font-size:13.5px;cursor:pointer;
    border:1px solid var(--line);background:#fff;color:#5d564b;transition:.16s;
  }
  .mact button:hover{background:#f6f2ea}
  .mact button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .mact button.primary:hover{background:#8d2919}

  /* 表单 */
  .form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .form label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
  .form label.full{grid-column:1 / -1}
  .form input{font-size:13.5px;padding:8px 11px}

  /* ---------- toast ---------- */
  #toast{
    position:fixed;left:50%;bottom:36px;transform:translate(-50%,16px);
    background:#2b2620;color:#f5f3ee;padding:10px 22px;border-radius:22px;
    font-size:13px;letter-spacing:.4px;opacity:0;pointer-events:none;
    transition:.25s;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.25);
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}

  /* ---------- 回到顶部 ---------- */
  #top{
    position:fixed;right:26px;bottom:26px;width:42px;height:42px;
    border-radius:50%;background:var(--ink);color:#fff;border:none;
    font-size:16px;cursor:pointer;opacity:0;pointer-events:none;
    transition:.25s;box-shadow:0 4px 14px rgba(0,0,0,.2);z-index:40;
  }
  #top.show{opacity:1;pointer-events:auto}
  #top:hover{background:var(--accent)}

  /* ---------- 响应式 ---------- */
  @media (max-width:900px){
    .layout{grid-template-columns:1fr;gap:0}
    aside{
      position:static;max-height:none;overflow:visible;
      border-right:none;border-bottom:1px solid var(--line);
      margin-bottom:24px;padding:14px 0;
      display:flex;gap:8px;overflow-x:auto;flex-wrap:nowrap;
    }
    aside h2{display:none}
    aside a{
      border-left:none;border:1px solid var(--line);border-radius:20px;
      padding:5px 12px;white-space:nowrap;background:#fff;font-size:13px;flex-shrink:0;
    }
    aside a.active{background:var(--accent);color:#fff;border-color:var(--accent)}
    aside a.active .n{color:#f7d9cf}
    header h1{font-size:22px}
    .grid{grid-template-columns:1fr}
    .form{grid-template-columns:1fr}
    .tb{gap:10px}
    #hint{display:none}
    #modeBtn{padding:8px 14px;font-size:12.5px}
  }
</style>
</head>
<body>

<header>
  <div class="hd">
    <div>
      <h1>中国报纸名录</h1>
      <p class="sub">按发报刊省局分类 · 共 <b id="total">1,233</b> 种报纸 · <b id="rcount">31</b> 个地区</p>
    </div>
  </div>
</header>

<div class="toolbar">
  <div class="tb">
    <input id="q" type="search" placeholder="搜索报刊名称 / 邮发代号 / 分类…">
    <span id="hint">支持模糊匹配</span>
    <!-- 模式切换按钮：固定在工具栏右上角，与“支持模糊匹配”同一水平线，sticky 保证滚屏不消失 -->
    <button id="modeBtn" class="">🔒 进入编辑模式</button>
  </div>
</div>

<div id="editbar" class="">
  <div class="inner">
    <span>✎ <b>编辑模式已开启</b> —— 点击卡片可修改，标题右上角可新增</span>
    <span class="sp"></span>
    <button id="importBtn" class="warn">⬇ 导入数据</button>
    <button id="exportBtn" class="warn">⬆ 导出数据</button>
    <button id="exportHtmlBtn" class="html">⬇ 导出HTML</button>
    <button id="exitBtn">退出编辑</button>
  </div>
</div>

<div class="wrap">
  <div class="layout">
    <aside id="nav"><h2>地区导航</h2></aside>
    <main id="app"></main>
  </div>
</div>

<button id="top" title="回到顶部" class="">↑</button>
<div id="toast" class="">编辑模式已开启</div>

<!-- 密码弹窗 -->
<div class="modal" id="pwdModal">
  <div class="mbox">
    <h3>管理员验证</h3>
    <p class="desc">请输入编辑模式密码后继续</p>
    <input type="password" id="pwdInput" placeholder="输入密码" autocomplete="off">
    <p class="err" id="pwdErr"></p>
    <div class="mact">
      <button id="pwdCancel">取消</button>
      <button class="primary" id="pwdOk">确认</button>
    </div>
  </div>
</div>

<!-- 编辑弹窗 -->
<div class="modal" id="editModal">
  <div class="mbox wide">
    <h3 id="emTitle">编辑报刊</h3>
    <p class="desc" id="emDesc">归属地区：天津市</p>
    <div class="form">
      <label class="full">报刊名称<input id="f_name" maxlength="80"></label>
      <label>邮发代号<input id="f_code" maxlength="20"></label>
      <label>刊期<input id="f_period" maxlength="20"></label>
      <label>单价（元）<input id="f_price" maxlength="12"></label>
      <label>年价（元）<input id="f_year" maxlength="12"></label>
      <label class="full">产品分类<input id="f_cat" maxlength="60"></label>
      <label class="full">官网链接<input id="f_url" placeholder="https://…（留空则自动搜索官网）"></label>
      <label class="full">数字报链接<input id="f_epaper" placeholder="https://…（留空则自动搜索数字报）"></label>
    </div>
    <p class="err" id="emErr"></p>
    <div class="mact">
      <button id="emCancel">取消</button>
      <button class="primary" id="emSave">保存</button>
    </div>
  </div>
</div>

<script>

   ========================================================================= */
const STORAGE_KEY = 'paper2026_exp_mw576rl6';

function buildInitialItems(){
  let idc = 1;
  const items = [];
  DATA.forEach(function(pair){
    const region = pair[0], list = pair[1];
    list.forEach(function(row){
      const code = row[1] || '';
      items.push({
        id: idc++,
        region: region,
        name: row[0] || '',
        code: code,
        period: row[2] || '',
        price: row[3] || '',
        year: row[4] || '',
        cat: row[5] || '',
        url: row.length > 6 ? (row[6] || '') : (BASE_URLS[code] || ''),
        epaper: row.length > 7 ? (row[7] || '') : (BASE_EPAPERS[code] || '')
      });
    });
  });
  return items;
}

let state = { items: buildInitialItems(), nextId: 100000 };

function normalizeItem(it){
  return {
    id: Number(it.id) || 0,
    region: String(it.region || '未分类'),
    name: String(it.name || ''),
    code: String(it.code || ''),
    period: String(it.period || ''),
    price: String(it.price || ''),
    year: String(it.year || ''),
    cat: String(it.cat || ''),
    url: String(it.url || ''),
    epaper: String(it.epaper || '')
  };
}

function loadFromStorage(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return false;
    const o = JSON.parse(raw);
    if(!o || !Array.isArray(o.items) || !o.items.length) return false;
    state.items = o.items.map(normalizeItem);
    state.nextId = o.nextId || 100000;
    return true;
  }catch(e){ return false; }
}

function saveToStorage(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      items: state.items,
      nextId: state.nextId,
      ts: Date.now()
    }));
    return true;
  }catch(e){ return false; }
}

/* =========================================================================
   密码校验（源码中不出现明文）
   ========================================================================= */
var _x = [0x18, 0x1A, 0x18, 0x1C];
var _y = 0x2A;

function checkPwd(s){
  if(typeof s !== 'string' || s.length !== _x.length) return false;
  for(var i=0;i<_x.length;i++){
    if((s.charCodeAt(i) ^ _y) !== _x[i]) return false;
  }
  return true;
}

/* =========================================================================
   工具函数
   ========================================================================= */
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function shortName(r){
  return r.replace(/(省|市|自治区|维吾尔|回族|壮族)/g,'') || r;
}
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2200);
}

function cardHTML(it, editMode){
  const hasUrl = !!(it.url || '').trim();
  const hasEp  = !!(it.epaper || '').trim();
  const key = (it.name + ' ' + it.code + ' ' + it.cat).toLowerCase();

  let foot = '';
  if(editMode){
    foot = '<div class="c-foot"><div class="c-actions">' +
      '<button class="mini" data-act="edit" data-id="' + it.id + '">编辑</button>' +
      '<button class="mini del" data-act="del" data-id="' + it.id + '">删除</button>' +
      '</div></div>';
  }else{
    foot = '<div class="c-foot">' +
      '<a class="c-link c-link-web" data-act="open-web" data-id="' + it.id + '">' +
        (hasUrl ? '进入官网 ↗' : '搜索官网 ↗') + '</a>' +
      '<a class="c-link c-link-ep" data-act="open-ep" data-id="' + it.id + '">' +
        (hasEp ? '数字报 ↗' : '搜索数字报 ↗') + '</a>' +
      '</div>';
  }

  return '<article class="card' + (editMode ? ' editing' : '') + '" data-id="' + it.id +
    '" data-s="' + esc(key) + '">' +
    '<div class="c-top"><span class="code">' + esc(it.code) + '</span>' +
    '<span class="period">' + esc(it.period) + '</span></div>' +
    '<h4 class="c-name">' + esc(it.name) + '</h4>' +
    '<div class="c-meta"><span>单价 <b>' + esc(it.price) + '</b> 元</span>' +
    '<span>年价 <b>' + esc(it.year) + '</b> 元</span></div>' +
    '<div class="c-cat" title="' + esc(it.cat) + '">' + esc(it.cat) + '</div>' +
    foot +
    '</article>';
}

function render(){
  const groups = new Map();
  state.items.forEach(function(it){
    if(!groups.has(it.region)) groups.set(it.region, []);
    groups.get(it.region).push(it);
  });

  let navHTML = '<h2>地区导航</h2>';
  let appHTML = '';
  let gi = 0;

  groups.forEach(function(list, region){
    const id = 'r' + (gi++);
    navHTML += '<a href="#' + id + '" data-target="' + id + '">' +
      esc(shortName(region)) + '<span class="n">' + list.length + '</span></a>';

    let cards = '';
    list.forEach(function(it){ cards += cardHTML(it, isEdit); });

    appHTML += '<section class="region" id="' + id + '">' +
      '<div class="region-hd">' +
        '<h3>' + esc(region) + '</h3>' +
        '<span class="count" data-n="' + list.length + '">' + list.length + ' 种</span>' +
        (isEdit ? '<button class="add" data-add="' + esc(region) + '">＋ 新增报刊</button>' : '') +
      '</div>' +
      '<div class="grid">' + cards + '</div>' +
      '</section>';
  });

  nav.innerHTML = navHTML;
  app.innerHTML = appHTML;

  document.getElementById('total').textContent = state.items.length.toLocaleString();
  document.getElementById('rcount').textContent = groups.size;

  if(observer) observer.disconnect();
  observer = new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if(en.isIntersecting){
        document.querySelectorAll('#nav a').forEach(function(a){
          a.classList.toggle('active', a.dataset.target === en.target.id);
        });
      }
    });
  }, { rootMargin: '-80px 0px -70% 0px' });
  document.querySelectorAll('.region').forEach(function(s){ observer.observe(s); });

  applySearch();
}

/* =========================================================================
   搜索
   ========================================================================= */
function applySearch(){
  const v = searchTerm.trim().toLowerCase();
  let matched = 0;

  document.querySelectorAll('.card').forEach(function(c){
    const ok = !v || c.dataset.s.indexOf(v) > -1;
    c.classList.toggle('hide', !ok);
    if(ok) matched++;
  });

  document.querySelectorAll('.region').forEach(function(sec){
    const visible = sec.querySelectorAll('.card:not(.hide)').length;
    sec.style.display = visible ? '' : 'none';
    const badge = sec.querySelector('.count');
    if(badge){
      const n = badge.dataset.n;
      badge.textContent = v ? (visible + ' / ' + n + ' 种') : (n + ' 种');
    }
  });

  hint.textContent = v ? ('匹配 ' + matched + ' 种') : '支持模糊匹配';
}

qEl.addEventListener('input', function(){
  searchTerm = qEl.value;
  applySearch();
});

  if(actBtn){
    e.stopPropagation();
    const id = Number(actBtn.dataset.id);
    if(actBtn.dataset.act === 'edit') openEditModal(id);
    else if(actBtn.dataset.act === 'del') removeItem(id);
    return;
  }

  const linkAct = e.target.closest('a[data-act="open-web"], a[data-act="open-ep"]');
  if(linkAct){
    e.stopPropagation();
    const id = Number(linkAct.dataset.id);
    const item = state.items.find(function(x){ return x.id === id; });
    if(!item) return;
    if(linkAct.dataset.act === 'open-web') openWeb(item);
    else openEpaper(item);
    return;
  }

  const card = e.target.closest('.card');
  if(!card) return;
  const id = Number(card.dataset.id);
  const item = state.items.find(function(x){ return x.id === id; });
  if(!item) return;
  if(isEdit) openEditModal(id);
  else openWeb(item);
});

function openWeb(it){
  let url = (it.url || '').trim();
  if(url && !/^https?:\/\//i.test(url)) url = 'https://' + url;
  if(!url) url = 'https://www.bing.com/search?q=' + encodeURIComponent(it.name + ' 官网');
  window.open(url, '_blank', 'noopener');
}

function openEpaper(it){
  let url = (it.epaper || '').trim();
  if(url && !/^https?:\/\//i.test(url)) url = 'https://' + url;
  if(!url) url = 'https://www.bing.com/search?q=' + encodeURIComponent(it.name + ' 数字报');
  window.open(url, '_blank', 'noopener');
}

/* =========================================================================
   编辑模式
   ========================================================================= */
modeBtn.addEventListener('click', function(){
  if(isEdit){ exitEditMode(); return; }
  openPwdModal();
});

function openPwdModal(){
  pwdInput.value = '';
  pwdErr.textContent = '';
  pwdModal.classList.add('show');
  setTimeout(function(){ pwdInput.focus(); }, 60);
}
function closePwdModal(){ pwdModal.classList.remove('show'); }
function tryUnlock(){
  if(checkPwd(pwdInput.value)){
    closePwdModal();
    enterEditMode();
  }else{
    pwdErr.textContent = '密码错误，请重试';
    pwdInput.value = '';
    pwdInput.focus();
  }
}
document.getElementById('pwdOk').addEventListener('click', tryUnlock);
document.getElementById('pwdCancel').addEventListener('click', closePwdModal);

  if(e.key === 'Enter') tryUnlock();
  if(e.key === 'Escape') closePwdModal();
});

function enterEditMode(){

  modeBtn.textContent = '📖 返回阅读模式';

  render();

function exitEditMode(){

  saveToStorage();
  isEdit = false;
  modeBtn.textContent = '🔒 进入编辑模式';
  modeBtn.classList.remove('on');
  editbar.classList.remove('show');

/* =========================================================================
   导出 / 导入（JSON）
   ========================================================================= */
document.getElementById('exportBtn').addEventListener('click', exportData);
document.getElementById('exportHtmlBtn').addEventListener('click', exportHTML);
document.getElementById('importBtn').addEventListener('click', function(){
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.json,application/json';
  inp.onchange = function(){
    if(inp.files && inp.files[0]) importData(inp.files[0]);
  };
  inp.click();
});

function exportData(){
  const payload = {
    app: '中国报纸名录',
    version: 3,
    exportTime: new Date().toISOString(),
    count: state.items.length,
    items: state.items
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type: 'application/json;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  const pad = function(n){ return String(n).padStart(2,'0'); };
  a.href = url;
  a.download = '中国报纸名录_' + d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) +
    '_' + pad(d.getHours()) + pad(d.getMinutes()) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1200);
  toast('已导出 JSON（' + state.items.length + ' 条）');
}

function importData(file){
  const reader = new FileReader();
  reader.onload = function(ev){
    let data;
    try{ data = JSON.parse(ev.target.result); }
    catch(err){ toast('导入失败：不是有效的 JSON 文件'); return; }

    let rawItems = null;
    if(Array.isArray(data)) rawItems = data;
    else if(data && Array.isArray(data.items)) rawItems = data.items;

    if(!rawItems || !rawItems.length){
      toast('导入失败：文件结构不正确');
      return;
    }

    const clean = [];
    rawItems.forEach(function(it){
      if(!it || !it.name) return;
      clean.push(normalizeItem(it));
    });

    if(!clean.length){ toast('导入失败：没有有效数据'); return; }
    if(!confirm('将用导入的 ' + clean.length + ' 条数据替换当前 ' + state.items.length +
      ' 条数据，确定继续吗？')) return;

    let nid = 1;
    clean.forEach(function(it){ it.id = nid++; });
    state.items = clean;
    state.nextId = nid;
    saveToStorage();
    render();
    toast('已导入 ' + clean.length + ' 条数据');
  };
  reader.readAsText(file, 'UTF-8');
}

/* =========================================================================
   导出 HTML（含编辑后的完整数据，可直接用于仓库提交）
   ========================================================================= */
function exportHTML(){
  /* 确保所有改动已保存到 state 与 localStorage */
  saveToStorage();

  /* 1. 按 region 重建 DATA 结构（8 字段：含 url / epaper） */
  const groups = new Map();
  state.items.forEach(function(it){
    if(!groups.has(it.region)) groups.set(it.region, []);
    groups.get(it.region).push(it);
  });
  const newData = [];
  groups.forEach(function(list, region){
    const rows = list.map(function(it){
      return [
        it.name,
        it.code,
        it.period,
        it.price,
        it.year,
        it.cat,
        it.url || '',
        it.epaper || ''
      ];
    });
    newData.push([region, rows]);
  });

  /* 2. 序列化 DATA */
  const dataStr = 'const DATA = ' + stringifyData(newData) + ';';

  /* 3. 取当前完整 HTML */
  let html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;

  /* 4. 替换 DATA 区段 */
  const dataRegex = /\/\* ===DATA_START=== \*\/[\s\S]*?\/\* ===DATA_END=== \*\//;
  if(!dataRegex.test(html)){
    toast('导出失败：未找到数据标记');
    return;
  }
  html = html.replace(
    dataRegex,
    '/* ===DATA_START=== */\n' + dataStr + '\n/* ===DATA_END=== */'
  );

  /* 5. 换一个独立的 STORAGE_KEY，避免与当前页面 localStorage 互相污染 */
  const exportKey = 'paper2026_exp_' + Date.now().toString(36);
  html = html.replace(
    /const STORAGE_KEY = '[^']*';/,
    "const STORAGE_KEY = '" + exportKey + "';"
  );

  /* 6. 用 DOMParser 清理编辑态 UI，保证导出文件初始为阅读模式 */
  const doc = new DOMParser().parseFromString(html, 'text/html');

  const eb = doc.getElementById('editbar');
  if(eb) eb.classList.remove('show');

  const mb = doc.getElementById('modeBtn');
  if(mb){
    mb.classList.remove('on');
    mb.textContent = '🔒 进入编辑模式';
  }

  /* 清空已渲染内容，页面首次加载时脚本会重新渲染 */
  const navEl = doc.getElementById('nav');
  if(navEl) navEl.innerHTML = '<h2>地区导航</h2>';
  const appEl = doc.getElementById('app');
  if(appEl) appEl.innerHTML = '';

  /* 7. 序列化并下载 */
  const finalHtml = '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;
  const blob = new Blob([finalHtml], {type: 'text/html;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  const pad = function(n){ return String(n).padStart(2,'0'); };
  a.href = url;
  a.download = '中国报纸名录_' + d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) +
    '_' + pad(d.getHours()) + pad(d.getMinutes()) + '.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
  toast('已导出 HTML（' + state.items.length + ' 条）');
}

/* 将 [[region, [[...8字段]]], ...] 序列化成美观的 JS 字面量 */
function stringifyData(arr){
  function escJS(s){
    return String(s == null ? '' : s)
      .replace(/\\/g, '\\\\')
      .replace(/"/g, '\\"')
      .replace(/\n/g, '\\n')
      .replace(/\r/g, '\\r')
      .replace(/\t/g, '\\t');
  }
  let out = '[\n';
  arr.forEach(function(pair, pi){
    out += '["' + escJS(pair[0]) + '",[\n';
    pair[1].forEach(function(row, ri){
      out += '[' + row.map(function(c){ return '"' + escJS(c) + '"'; }).join(',') + ']';
      if(ri < pair[1].length - 1) out += ',';
      out += '\n';
    });
    out += ']]';
    if(pi < arr.length - 1) out += ',';
    out += '\n';
  });
  out += ']';
  return out;
}

/* =========================================================================
   编辑弹窗
   ========================================================================= */
function openAddModal(region){
  addingRegion = region;
  editingId = null;
  emTitle.textContent = '新增报刊';
  emDesc.textContent = '归属地区：' + region;
  emErr.textContent = '';
  fName.value = ''; fCode.value = ''; fPeriod.value = '';
  fPrice.value = ''; fYear.value = ''; fCat.value = '';
  fUrl.value = ''; fEpaper.value = '';
  editModal.classList.add('show');
  setTimeout(function(){ fName.focus(); }, 60);
}

function openEditModal(id){
  const it = state.items.find(function(x){ return x.id === id; });
  if(!it) return;
  addingRegion = null;
  editingId = id;
  emTitle.textContent = '编辑报刊';
  emDesc.textContent = '归属地区：' + it.region;
  emErr.textContent = '';
  fName.value = it.name;
  fCode.value = it.code;
  fPeriod.value = it.period;
  fPrice.value = it.price;
  fYear.value = it.year;
  fCat.value = it.cat;
  fUrl.value = it.url || '';
  fEpaper.value = it.epaper || '';
  editModal.classList.add('show');
  setTimeout(function(){ fName.focus(); }, 60);
}

function closeEditModal(){ editModal.classList.remove('show'); }
document.getElementById('emCancel').addEventListener('click', closeEditModal);

document.getElementById('emSave').addEventListener('click', function(){
  const name = fName.value.trim();
  if(!name){
    emErr.textContent = '报刊名称不能为空';
    fName.focus();
    return;
  }
  const payload = {
    name: name,
    code: fCode.value.trim(),
    period: fPeriod.value.trim(),
    price: fPrice.value.trim(),
    year: fYear.value.trim(),
    cat: fCat.value.trim(),
    url: fUrl.value.trim(),
    epaper: fEpaper.value.trim()
  };

  if(editingId){
    const it = state.items.find(function(x){ return x.id === editingId; });
    if(it){
      it.name = payload.name;
      it.code = payload.code;
      it.period = payload.period;
      it.price = payload.price;
      it.year = payload.year;
      it.cat = payload.cat;
      it.url = payload.url;
      it.epaper = payload.epaper;
    }
    toast('已保存修改');
  }else if(addingRegion){
    state.items.push({
      id: state.nextId++,
      region: addingRegion,
      name: payload.name,
      code: payload.code,
      period: payload.period,
      price: payload.price,
      year: payload.year,
      cat: payload.cat,
      url: payload.url,
      epaper: payload.epaper
    });
    toast('已新增报刊');
  }

  saveToStorage();
  closeEditModal();
  render();
});

editModal.addEventListener('click', function(e){
  if(e.target === editModal) closeEditModal();
});
pwdModal.addEventListener('click', function(e){
  if(e.target === pwdModal) closePwdModal();
});
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){
    closePwdModal();
    closeEditModal();
  }
});

/* =========================================================================
   删除
   ========================================================================= */
function removeItem(id){
  const it = state.items.find(function(x){ return x.id === id; });
  if(!it) return;
  if(!confirm('确定删除《' + it.name + '》吗？')) return;
  state.items = state.items.filter(function(x){ return x.id !== id; });
  saveToStorage();
  render();
  toast('已删除');
}

topBtn.addEventListener('click', function(){
