/* ================= 渲染逻辑 ================= */
const gridEl   = document.getElementById('grid');
const tabsEl   = document.getElementById('tabs');
tabsEl.innerHTML = '';

const CATS = ['全部', ...new Set(SITES.map(s => s.cat))];
let currentCat = '全部';

/* 分类标签 */
CATS.forEach(cat => {
  const count = cat === '全部' ? SITES.length : SITES.filter(s => s.cat === cat).length;
  const btn = document.createElement('button');
  btn.className = 'tab' + (cat === '全部' ? ' active' : '');
  btn.dataset.cat = cat;
  btn.innerHTML = `${cat}<span class="n">${count}</span>`;
  btn.addEventListener('click', () => {
    currentCat = cat;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.cat === cat));
    render();
  });
  tabsEl.appendChild(btn);
});

/* 卡片渲染 */

  const list = SITES.filter(s => currentCat === '全部' || s.cat === currentCat);

  gridEl.innerHTML = '';

  const frag = document.createDocumentFragment();
  list.forEach((s, i) => {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = s.url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.style.setProperty('--c', s.color);
    a.style.animationDelay = Math.min(i, 22) * 18 + 'ms';
    a.innerHTML = `
      <div class="logo${s.icon.length > 1 ? ' two' : ''}">${s.icon}</div>
      <div class="body">
        <div class="name">
          ${s.name}${s.cn ? `<span class="cn">${s.cn}</span>` : ''}${s.en ? '<span class="en">EN</span>' : ''}
          <span class="arrow">↗</span>
        </div>
        <div class="desc">${s.desc}</div>
      </div>`;
    frag.appendChild(a);
  });
  gridEl.appendChild(frag);
}

document.getElementById('year').textContent = new Date().getFullYear();

render();
</script>

</body></html>
